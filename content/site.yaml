title: "بحث‌کلاب"
tagline: "آموزش تفکر روشن و سنجش مشترک استدلال"
description: "بحث‌کلاب دو بخش به‌هم‌پیوسته دارد: تالار آموزش برای شناخت ساختار استدلال و تشخیص مغالطه‌ها، و باشگاه برای سنجش مشترک ادعاها در چارچوبی قاعده‌مند. روبه‌روی هم نیستیم؛ کنار هم ادعا را بررسی می‌کنیم تا خطاهایش آشکار شود و با هم به حقیقت نزدیک‌تر شویم. ورود اختیاری است، توافق اجباری در کار نیست و استقلال اندیشهٔ هر فرد گرامی داشته می‌شود."
featuredLessonSlug: "judgment-literacy"
