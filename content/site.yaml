principles:
  - title: "ادعا را نقد کن، نه شخص را"
    description: "هوش، انگیزه، یا هویت طرف مقابل موضوع بحث نیست. ادعا و شواهدش را بررسی کن."
  - title: "اول بفهم، بعد نقد کن"
    description: "قبل از به چالش کشیدن، مطمئن شو دقیقاً می‌فهمی طرف مقابل چه می‌گوید. قوی‌ترین نسخهٔ حرفش را بیان کن."
  - title: "سؤال برای فهمیدن است، نه تحقیر"
    description: "پرسش‌ها باید شفاف‌کننده یا آزمون‌گر باشند، نه ابزار تحقیر یا نمایش زرنگی."
  - title: "تغییر نظر، باختن نیست"
    description: "اگر شواهد و استدلال بهتری دیدی، نظرت را عوض کن. این نشانهٔ صداقت فکری است، نه ضعف."
  - title: "همان معیار را برای همه به کار ببر"
    description: "استانداردی که برای نقد دیدگاه مخالف داری، برای دیدگاه محبوب خودت هم داشته باش."
  - title: "تکنیک را توصیف کن، نیت را حدس نزن"
    description: "می‌توانی بگویی «این جمله توجه را از شواهد دور می‌کند»، نه «داری عمداً گولم می‌زنی»."
livePractice:
  title: "رینگ بحث"
  description: "جلسه‌های ساختاریافته‌ای که در آن ایده روی میز می‌رود و منطق در برابر منطق قرار می‌گیرد. قوانین رینگ از گفت‌وگو محافظت می‌کنند: بدون حمله به شخص، بدون تحقیر، بدون هیاهو — فقط محک زدن وزن استدلال. به‌زودی می‌توانی در این جلسه‌ها شرکت کنی؛ تا آن موقع با تمرین‌های نوشتاری شروع کن."
  href: "/practice"