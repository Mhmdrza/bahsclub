title: "بحث‌کلاب"
tagline: "باشگاه مبارزه با کلام — منطق در برابر منطق"
description: "بحث‌کلاب مثل فایت‌کلاب است، اما با کلام: با ساختار و قوانینی روشن، منطق در برابر منطق می‌ایستد — مثل شطرنج با مهره‌های استدلال. اینجا ایده‌ها در اتاق تست فشار محک می‌خورند تا استدلال‌های سست از فکرهای محکم جدا شوند."
featuredLessonSlug: "judgment-literacy"
