principles:
  - title: "ادعا را نقد کن، نه شخص را"
    description: "هوش، انگیزه، یا هویت طرف مقابل موضوع بحث نیست. ادعا و شواهدش را بررسی کن."
  - title: "احترام کامل به استقلال رأی"
    description: "قرار نیست نظر کسی را عوض کنیم و نه حتی به توافق برسیم. هدف فقط محک زدن وزن و تاب‌آوری استدلال‌هاست."
  - title: "اول بفهم، بعد نقد کن"
    description: "قبل از به چالش کشیدن، مطمئن شو دقیقاً می‌فهمی طرف مقابل چه می‌گوید. قوی‌ترین نسخهٔ حرفش را بیان کن."
  - title: "سؤال برای فهمیدن است، نه تحقیر"
    description: "پرسش‌ها باید شفاف‌کننده یا آزمون‌گر باشند، نه ابزار تحقیر یا نمایش زرنگی."
  - title: "تغییر نظر اختیاری است، نه شکست"
    description: "اگر خودت شواهد بهتری دیدی، تغییر نظر نشانهٔ صداقت فکری است، اما هیچ فشاری از سوی باشگاه برای تغییر باور وجود ندارد."
  - title: "همان معیار را برای همه به کار ببر"
    description: "استانداردی که برای نقد دیدگاه مخالف داری، برای دیدگاه محبوب خودت هم داشته باش."
  - title: "تکنیک را توصیف کن، نیت را حدس نزن"
    description: "می‌توانی بگویی «این جمله توجه را از شواهد دور می‌کند»، نه «داری عمداً گولم می‌زنی»."
livePractice:
  title: "میز گفت‌وگو"
  description: "فضایی برای گذاشتن ایده روی میز و بررسی مشترک آن؛ قوانین باشگاه از گفت‌وگو محافظت می‌کنند: بدون حمله به شخص، بدون تحقیر، بدون هیاهو، و بدون اجبار به تغییر نظر یا رسیدن به توافق — فقط سنجش وزن استدلال. از تمرین‌های کوتاه شروع کن و هر زمان خواستی ادعایت را در باشگاه به سنجش بگذار."
  href: "/practice"