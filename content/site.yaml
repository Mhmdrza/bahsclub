title: "بحث‌کلاب"
tagline: "باشگاه مناظره و تالار آموزش تفکر نقادانه"
description: "بحث‌کلاب دو بال به‌هم‌پیوسته دارد: تالار آموزش برای فراگیری تئوری استدلال و فنون دفاع در تعارض، و باشگاه مناظره برای آزمودن ایده‌ها در یک چارچوب قانون‌مند؛ با احترام به استقلال رأی، بدون تلاش برای تغییر عقیده و بدون توافق اجباری."
featuredLessonSlug: "judgment-literacy"
