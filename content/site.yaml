title: "بحث‌کلاب"
tagline: "از ایده‌هایت دفاع نکن. محکشان بزن."
description: "بحث‌کلاب جایی برای تمرینِ بحثِ سازنده است — نه جدلِ بی‌حاصل. اینجا باورهایت را به آزمون می‌گذاری، استدلالت را قوی‌تر می‌کنی و یاد می‌گیری چطور بدون دشمنی، مخالفت کنی."
