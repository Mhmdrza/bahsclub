        - نیت‌خوانی خطرناک است چون نیت دیگران را قطعی نمی‌دانیم؛ پاسخ دادن به حدسِ ذهنی به‌جای خودِ جمله، دعوا می‌سازد.
        - 'تفکیک کلیدی: نیت آنچه طرف در دل داشت، تأثیر آنچه حرفش در تو ایجاد کرد — این دو می‌توانند کاملاً متفاوت باشند.'
        - جملهٔ «من این را این‌طور فهمیدم؛ درست فهمیدم؟» اتهام نیست، فضا باز می‌گذارد و امکان تصحیح می‌دهد.
        - اگر بعد از دو بار پرسیدن دربارهٔ نیت روشن نشد، به‌جای نیت روی همان جمله و تأثیرش تمرکز کن.
      takeaway: نیت را حدس نزن؛ بپرس «منظورت دقیقاً چه بود؟» و از تأثیر حرف بگو، نه از قصد.
