pages:
  - slug: about
    title: درباره حرف‌کلاب
    description: >-
      حرف‌کلاب یک باشگاه بحثِ سازنده است — جایی که هدف، کشف این است که باورهای ما از چه ساخته شده‌اند و چه چیزی می‌تواند
      آن‌ها را تغییر دهد.
    status: published
    order: 1
  - slug: rules
    title: مرام‌نامه و اصول ده‌گانهٔ حرف‌کلاب
    description: ده اصلی که فرهنگ حرف‌کلاب را می‌سازند — اصولی برای بحث‌هایی که هدفشان فهمیدن است، نه برنده شدن.
    status: published
    order: 2
  - slug: faq
    title: سؤالات متداول
    description: >-
      پاسخ پرسش‌های پرتکرار دربارهٔ حرف‌کلاب: از نحوهٔ شروع و رایگان بودن محتوا تا تفاوت آن با مناظره و چگونگی عضویت در
      باشگاه.
    status: published
    order: 7
  - slug: getting-started
    title: از کجا شروع کنم؟
    description: >-
      مسیر پیشنهادی برای ورود به حرف‌کلاب در سه گام: نقطهٔ شروع خودت را پیدا کن، مسیر سواد قضاوت را بگذران، و با
      تمرین‌های کوتاه مهارت را به عمل تبدیل کن.
    status: published
    order: 6
  - slug: glossary
    title: واژه‌نامه
    description: >-
      اصطلاح‌های کلیدی گفت‌وگوی سازنده — از ادعا و شواهد تا مغالطه‌ها و مهارت‌های گوش دادن. هر واژه با یک تعریف کوتاه و
      پیوند به مقالهٔ کامل.
    status: published
    order: 5
  - slug: mission
    title: مأموریت ما
    description: 'چرا اینجا هستیم: تبدیل گفت‌وگو از یک استعداد نادر به یک مهارت همگانی — از پایه تا تسلط.'
    status: published
    order: 4
  - slug: session-format
    title: ساختار یک جلسهٔ بحث
    description: >-
      ساختار هشت‌مرحله‌ای یک جلسهٔ حرف‌کلاب: از ارائهٔ باور تا مرور فرایند. یاد بگیرید چطور یک قضاوت را بدون رقابت و با
      همکاری محک بزنید.
    status: published
    order: 3
topics:
  - slug: fallacies
    title: مغالطه‌ها
    description: 'خطاهای رایج در استدلال: یاد بگیرید چطور مغالطه‌ها را بشناسید و چرا گفتن اسم مغالطه کافی نیست.'
    status: published
    order: 4
  - slug: foundations
    title: مبانی
    description: 'مفاهیم پایه برای ورود به دنیای بحثِ سازنده: تفاوت بحث و جدل، ساختار استدلال، و پرسش‌گری.'
    status: published
    order: 2
  - slug: judgment-literacy
    title: سواد قضاوت
    description: 'مهارت‌های پایه برای بحثِ سازنده: چطور یک ادعا را بشناسیم، بررسی کنیم، و به‌روزرسانی کنیم.'
    status: published
    order: 1
  - slug: practice
    title: تمرین
    description: تمرین‌های عملی برای محک زدن باورها، تقویت استدلال، و یادگیری مشارکتی.
    status: published
    order: 5
  - slug: tactics
    title: تاکتیک‌های انحرافی
    description: تکنیک‌هایی که بحث را از مسیر خارج می‌کنند — و چطور بدون تشدید تنش، آن‌ها را خنثی کنیم.
    status: published
    order: 3
