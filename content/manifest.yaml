  - slug: tone-of-voice
    title: 'لحن صدا: چطور صدایت پیام را عوض می‌کند'
    description: از «دی‌جی آخر شب» تا لحن رسمی — چطور سرعت، بلندی و گرمی صدا، حرف تو را از آرامش به تهدید می‌برد.
