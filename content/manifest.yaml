      - strategic-silence
    tldr:
      line: null
      points:
        - 'لحن را سه چیز می‌سازد: سرعت، بلندی و گرمی؛ تند و بلند اضطراب یا تهدید می‌رساند، آرام و پایین اعتماد و تسلط.'
        - الگوی «دی‌جی آخر شب» — صدای پایین، آهسته و نزدیک — به‌خاطر هم‌آوایی عاطفی، طرف مقابل را ناخودآگاه آرام می‌کند.
        - بلند کردن صدا پیام «من کنترل ندارم» می‌دهد و طرف مقابل را هم به بالا بردن صدا وا می‌دارد؛ بازیِ بی‌برنده.
        - لحن پایین ضعف نیست، نشانهٔ تسلط است؛ اگر صدا بالا رفت با یک نفس و مکث برش گردان — نه برای ترس، برای اعتماد.
      takeaway: وقتی تنش بالا رفت کلمه را عوض نکن — صدا را پایین، آهسته و گرم کن تا طرف مقابل هم آرام شود.
