lessons:
  - slug: judgment-literacy
    title: 'مسیر اصلی: سواد قضاوت'
    description: >-
      یاد بگیر چطور باورهایت را محک بزنی، استدلالت را قوی‌تر کنی، و بدون دشمنی مخالفت کنی. این مسیر، مهارت‌های پایهٔ بحث
      را پوشش می‌دهد.
    status: published
    order: 1
    steps:
      - what-is-judgment-testing
      - claim-vs-interpretation
      - precise-claims
      - steelman-opponent
      - structure-of-argument
      - asking-better-questions
      - evidence-quality
      - confidence-and-uncertainty
      - falsifiability-and-revision
      - fair-effective-debate
    featured: true
    milestone: >-
      می‌توانی یک باور را با کمک دیگران محک بزنی، استدلالش را نقشه‌برداری کنی، و تشخیص دهی چه شواهدی می‌تواند نظرات را
      تغییر دهد.
  - slug: spotting-tactics
    title: تشخیص و پاسخ به تاکتیک‌های انحرافی
    description: تاکتیک‌های رایجی که بحث را از مسیر خارج می‌کنند بشناس و یاد بگیر چطور بدون تشدید تنش، بحث را به مسیر برگردانی.
    status: published
    order: 2
    steps:
      - what-is-fallacy
      - ad-hominem
      - straw-man
      - false-dilemma
      - red-herring
      - appeal-to-authority
      - whataboutism
      - responding-to-tactics
    featured: false
    milestone: می‌توانی هشت تاکتیک رایج را در گفت‌وگو تشخیص دهی و بدون متهم کردن طرف مقابل، بحث را به موضوع اصلی برگردانی.
  - slug: deeper-curriculum
    title: 'مسیر پیشرفته: عمیق‌تر شدن'
    description: 'مفاهیم پیشرفته‌تر سواد قضاوت: از کیفیت شواهد تا تشخیص اقناع عاطفی. برای کسانی که مسیر اصلی را تمام کرده‌اند.'
    status: published
    order: 3
    steps:
      - evidence-quality
      - framing-and-omission
      - alternative-explanations
      - correlation-and-causation
      - expertise-and-incentives
      - emotional-persuasion
      - hidden-assumption
      - cherry-picking
      - belief-stress-test
      - when-to-say-i-dont-know
    featured: false
    milestone: می‌توانی شواهد را از نظر کیفیت ارزیابی کنی، چهارچوب‌بندی و حذف را تشخیص دهی، و بین همبستگی و علیت تمایز قائل شوی.
pages:
  - slug: about
    title: درباره بحث‌کلاب
    description: >-
      بحث‌کلاب یک باشگاه بحثِ سازنده است — جایی که هدف، کشف این است که باورهای ما از چه ساخته شده‌اند و چه چیزی می‌تواند
      آن‌ها را تغییر دهد.
    status: published
    order: 1
  - slug: club-rules
    title: قوانین ده‌گانهٔ بحث‌کلاب
    description: ده قانونی که فرهنگ بحث‌کلاب را می‌سازند — قواعدی برای بحث‌هایی که هدفشان فهمیدن است، نه برنده شدن.
    status: published
    order: 2
  - slug: session-format
    title: ساختار یک جلسهٔ بحث
    description: >-
      ساختار هشت‌مرحله‌ای یک جلسهٔ بحث‌کلاب: از ارائهٔ باور تا مرور فرایند. یاد بگیرید چطور یک قضاوت را بدون رقابت و با
      همکاری محک بزنید.
    status: published
    order: 3
topics:
  - slug: fallacies
    title: مغالطه‌ها
    description: 'خطاهای رایج در استدلال: یاد بگیرید چطور مغالطه‌ها را بشناسید و چرا گفتن اسم مغالطه کافی نیست.'
    status: published
    order: 4
  - slug: foundations
    title: مبانی
    description: 'مفاهیم پایه برای ورود به دنیای بحثِ سازنده: تفاوت بحث و جدل، ساختار استدلال، و پرسش‌گری.'
    status: published
    order: 2
  - slug: judgment-literacy
    title: سواد قضاوت
    description: 'مهارت‌های پایه برای بحثِ سازنده: چطور یک ادعا را بشناسیم، بررسی کنیم، و به‌روزرسانی کنیم.'
    status: published
    order: 1
  - slug: practice
    title: تمرین
    description: تمرین‌های عملی برای محک زدن باورها، تقویت استدلال، و یادگیری مشارکتی.
    status: published
    order: 5
  - slug: tactics
    title: تاکتیک‌های انحرافی
    description: تکنیک‌هایی که بحث را از مسیر خارج می‌کنند — و چطور بدون تشدید تنش، آن‌ها را خنثی کنیم.
    status: published
    order: 3
